name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Compile Python
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Check JavaScript
        run: git ls-files '*.js' '*.mjs' | grep -v 'mermaid.min.js' | xargs -n1 node --check

      - name: Check JSON
        run: git ls-files -z '*.json' | xargs -0 -n1 python -m json.tool --no-ensure-ascii > /dev/null

      - name: Guide previews in sync
        run: python docs/tools/sync_previews.py --check

      - name: Marketplace manifests match
        run: |
          if ! cmp .claude-plugin/marketplace.json .codebuddy-plugin/marketplace.json; then
            echo "::error::.codebuddy-plugin/marketplace.json must be an identical copy of .claude-plugin/marketplace.json"
            exit 1
          fi

  vendor-files:
    name: Vendor files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No icon pack, index or generated icon file is tracked
        run: |
          if git ls-files | grep -E '\.zip$|\.index\.json$|kit/icons\.js$'; then
            echo "::error::These files hold vendor icons. Their terms forbid redistribution. Remove them."
            exit 1
          fi

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
